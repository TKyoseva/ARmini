name: check
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]   # night/* PRs into dev get a green/red check before merge

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD and KiCad 10
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y openscad kicad
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run checks
        run: bash scripts/check.sh
      - name: Export fabrication files
        if: always()
        run: |
          mkdir -p build/fab
          for pcb in pcb/*/*.kicad_pcb; do [ -e "$pcb" ] || continue
            n=$(basename "$pcb" .kicad_pcb)
            kicad-cli pcb export gerbers -o "build/fab/$n/" "$pcb"
            kicad-cli pcb export drill   -o "build/fab/$n/" "$pcb"
            kicad-cli pcb export step    -o "build/fab/$n.step" "$pcb"
          done
      - name: Export print STLs (one file per printed part, from the parametric CAD)
        if: always()
        run: |
          mkdir -p build/stl
          for part in hull_fore hull_aft thruster_coupon thruster_bracket thruster_arm power_box power_lid \
                      beam_bracket arch_post pivot_bracket arm_drive arm_idler coupler cam_pan_mount cam_plate dummy_head dummy_lid; do
            openscad -D "part=\"$part\"" -o "build/stl/$part.stl" cad/openscad/AR-Mini_v1.scad 2>> build/stl/openscad.log \
              && echo "STL ok: $part" || echo "STL FAILED: $part"
          done
          # right-hand (mirrored) hull sections
          for part in hull_fore hull_aft; do
            openscad -D "part=\"$part\"" -D "side=-1" -o "build/stl/${part}_R.stl" cad/openscad/AR-Mini_v1.scad 2>> build/stl/openscad.log \
              && echo "STL ok: ${part}_R" || echo "STL FAILED: ${part}_R"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ github.sha }}
          path: build/
