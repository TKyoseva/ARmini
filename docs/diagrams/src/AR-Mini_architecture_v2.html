</svg><figcaption>One ESP32-S3 (Olimex DevKit-Lipo) drives the thruster, the cradle servos and the tracks and reads both thermal cameras, the leak probe, the battery and the KILL rocker. The rocker also cuts the motor drivers in hardware (purple), so a stop never depends on the firmware. Solid boxes are tested on hardware, with the card that proved them; dashed boxes are designed or on order. The OV3660 camera runs on its own XIAO board and WiFi network. Sources: hardware/wiring/PINOUT.md, pcb/carrier-revB/SPEC.md, docs/FAILS_AND_FIXES.md, rudder spec 26.10.2026.</figcaption></figure></main></body></html>
