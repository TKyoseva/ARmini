; AR-Mini mission firmware (night task T1).
; `pio test -e native`      -> host unit tests of lib/core (no Arduino)
; `pio run  -e devkit_lipo` -> dry-run build for the Olimex ESP32-S3-DevKit-Lipo

[platformio]
default_envs = devkit_lipo

; ---------------------------------------------------------------------------
; Host tests. build_src_filter excludes src/ so `pio run` never compiles the
; Arduino code for the host; the tests pull in lib/core through the LDF.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Werror
build_src_filter = -<*>

; ---------------------------------------------------------------------------
; Target: Olimex ESP32-S3-DevKit-Lipo.
; Board id: PlatformIO (espressif32, checked 08.10.2026 with `pio boards olimex`)
; has only the classic-ESP32 "esp32-devkitlipo"; there is no id for the S3
; variant. We therefore use the generic Espressif S3 DevKitC-1 id and set the
; memory type for the ESP32-S3-WROOM-1-N8R8 module (8 MB quad-SPI flash,
; 8 MB octal PSRAM).
; SOURCE: module marking MCN8R8 = ESP32-S3-WROOM-1-N8R8, board rev. B (photo C010_02)
[env:devkit_lipo]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
build_src_filter = +<*>
