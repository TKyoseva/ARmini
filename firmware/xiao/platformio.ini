; AR-Mini · Seeed XIAO ESP32-S3 Sense
;
;   pio run                 -> builds the default env (xiao_esp32s3, the old controller skeleton)
;   pio run -e cam -t upload-> OV3660 camera node (C049): WiFi AP + MJPEG stream. Needs include/secrets.h
;                              (copy include/secrets.example.h), so it is NOT in default_envs / CI.
;
; 25.10 (Teddy, decision 0005): the XIAO Sense is the OV3660 camera node only, nothing else is wired to it.

[platformio]
default_envs = xiao_esp32s3

[xiao]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_esp32s3]
extends = xiao
build_src_filter = +<*> -<cam/>
lib_ldf_mode = deep+
lib_deps =
  adafruit/Adafruit MLX90640
  adafruit/Adafruit PWM Servo Driver Library
  adafruit/Adafruit BNO055
  adafruit/Adafruit Unified Sensor
; SCServo (Waveshare) -> lib/SCServo from the wiki archive
; MLX90642 -> firmware/bench/lib/MLX90642 (Melexis driver, GitHub) — the thermal cameras moved to the DevKit (25.10)

; ---------------------------------------------------------------------------
; Camera node (C049). esp32-camera ships inside the Arduino core (esp_camera.h), no extra lib.
[env:cam]
extends = xiao
build_src_filter = +<cam/>
build_src_flags = -Wall -Wextra
