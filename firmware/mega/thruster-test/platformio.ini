[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
; Servo.h is not in framework-arduino-avr 5.4.0. Official Arduino library,
; same attach() / writeMicroseconds() API the sketch uses. Pinned.
lib_deps =
  arduino-libraries/Servo@1.3.0
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF
