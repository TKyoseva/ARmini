; AR-Mini bench sketches (night task T3) · Olimex ESP32-S3-DevKit-Lipo
;
;   pio run                      -> builds every module env (bts7960 pca9685 st3215 mlx90640 thermal bno055 ladder esc)
;   pio run -e bts7960 -t upload -> flash one module sketch over USB-C
;   pio device monitor           -> 115200 baud, type `?` for the CLI
;   pio test -e native           -> host unit tests of lib/benchcore (Unity, no Arduino)
;
; One env per module. build_src_filter selects src/<module>/ + src/common/.
; lib/benchcore (Ramp, Deadman, Csv, SoftLimit) is pure C++ and shared by all envs and the host tests.
; Library versions are pinned (exact) so the morning build is the one that was tested at night.

[platformio]
default_envs = bts7960, pca9685, st3215, mlx90640, thermal, bno055, ladder, esc

; ---------------------------------------------------------------------------
; Host tests. build_src_filter excludes src/ so nothing Arduino is compiled on
; the host; the tests pull in lib/benchcore through the LDF.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Werror
build_src_filter = -<*>

; ---------------------------------------------------------------------------
; Common target settings: Olimex ESP32-S3-DevKit-Lipo.
; Board id: PlatformIO has no entry for the S3 DevKit-Lipo (only the classic
; "esp32-devkitlipo"); the generic Espressif S3 DevKitC-1 id is pin-compatible
; (Olimex manual p7: "Extension's pinout is fully compatible to the ESP32-S3-DevKitC-1").
; Memory type for the ESP32-S3-WROOM-1-N8R8 module (8 MB QSPI flash, 8 MB octal PSRAM).
; SOURCE: firmware/armini/platformio.ini (module marking MCN8R8 confirmed, card C010)
[esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
framework = arduino
monitor_speed = 115200
monitor_filters = default, time
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -Isrc/common
; warnings only for our own sources (src/ and lib/benchcore); the framework is built with its own flags
build_src_flags = -Wall -Wextra

; ---------------------------------------------------------------------------
[env:bts7960]
extends = esp32s3
build_src_filter = +<common/> +<bts7960/>

[env:pca9685]
extends = esp32s3
build_src_filter = +<common/> +<pca9685/>
lib_deps =
  adafruit/Adafruit PWM Servo Driver Library@3.0.3
  adafruit/Adafruit BusIO@1.17.4

[env:st3215]
extends = esp32s3
build_src_filter = +<common/> +<st3215/>
; Waveshare SCServo (SMS_STS class), registry mirror of waveshareteam/ugv_base_general
lib_deps =
  workloads/SCServo@1.0.1

[env:mlx90640]
extends = esp32s3
build_src_filter = +<common/> +<mlx90640/>
lib_deps =
  adafruit/Adafruit MLX90640@1.1.2
  adafruit/Adafruit BusIO@1.17.4

; Both thermal cameras on the DevKit (C048 + C029): MLX90642-D45 on Wire via lib/MLX90642 (Melexis + Arduino glue),
; MLX90640 110° on Wire1 via Adafruit.
[env:thermal]
extends = esp32s3
build_src_filter = +<common/> +<thermal/>
lib_deps =
  adafruit/Adafruit MLX90640@1.1.2
  adafruit/Adafruit BusIO@1.17.4

[env:bno055]
extends = esp32s3
build_src_filter = +<common/> +<bno055/>
lib_deps =
  adafruit/Adafruit BNO055@1.6.4
  adafruit/Adafruit Unified Sensor@1.1.15
  adafruit/Adafruit BusIO@1.17.4

[env:ladder]
extends = esp32s3
build_src_filter = +<common/> +<ladder/>
; Serial is the native USB (left port) while ARDUINO_USB_CDC_ON_BOOT=1.
; This sketch is watched on the CH340 (right port, UART0). With the flag 0,
; Serial is UART0. SOURCE: Arduino core HardwareSerial.h (CDC_ON_BOOT selects Serial vs Serial0)
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -Isrc/common

; Thruster ESCs on LEDC GPIO1/2 (C024). Keeps CDC_ON_BOOT=1 like pca9685: monitor on the LEFT USB-C.
[env:esc]
extends = esp32s3
build_src_filter = +<common/> +<esc/>

; T12 (C028): WiFi AP + phone page. Needs include/secrets.h (copy secrets.example.h), so it is not in
; default_envs / CI; build with `pio run -e remote`.
[env:remote]
extends = esp32s3
build_src_filter = +<common/> +<remote/>
lib_deps = links2004/WebSockets@2.7.3

; C056 (29.10): one thruster on the centre line (ESC on GPIO1, as `remote`) + MG90S rudder on GPIO2 direct
; (S8050 bypassed, NOT inverted). Thrust slider = thruster, turn slider = rudder. Same page, same safety.
[env:remote_rudder]
extends = env:remote
build_flags =
  ${esp32s3.build_flags}
  -DREMOTE_RUDDER

; C058: same as remote_rudder, but GPIO1/GPIO2 go through a 74HCT125 at +5 V (non-inverting) instead of the S8050.
; Flash this ONLY with the 74HCT125 wired: with the S8050 still in, the ESC would see inverted pulses.
[env:remote_rudder_hct]
extends = env:remote
build_flags =
  ${esp32s3.build_flags}
  -DREMOTE_RUDDER
  -DESC_BUFFER

; Pool run 31.10.2026: remote_rudder_hct + the cradle lift. PCA9685 0x40 on I2C-0 (GPIO48/47), the two TD-8120MG on
; CH12/CH13 (`pair` maths from C023: 50 deg = U deployed, 130 = raised), third slider "lift" on the phone page.
; Servo V+ = 5 V from the QIQIAZI buck on F2 — never 12 V. Flash ONLY with the 74HCT125 wired (see remote_rudder_hct).
[env:remote_pool]
extends = env:remote
build_flags =
  ${esp32s3.build_flags}
  -DREMOTE_RUDDER
  -DESC_BUFFER
  -DREMOTE_LIFT
lib_deps =
  ${env:remote.lib_deps}
  adafruit/Adafruit PWM Servo Driver Library@3.0.3
  adafruit/Adafruit BusIO@1.17.4
